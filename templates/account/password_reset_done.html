{% extends "account/base_entrance.html" %}
{% load i18n allauth account %}

{% block head_title %}{% trans "邮件已发送" %}{% endblock %}

{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px;">
    <div style="background:white;border-radius:20px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.15);text-align:center;">

        <div style="font-size:56px;margin-bottom:16px;">📧</div>
        <h1 style="font-size:22px;color:#333;margin-bottom:8px;">邮件已发送</h1>
        <p style="color:#666;font-size:14px;line-height:1.7;margin-bottom:24px;">
            重置密码的链接已经发到你的邮箱。<br>
            如果没收到，请检查下垃圾邮件箱 👀
        </p>

        <a href="{% url 'account_login' %}" style="display:inline-block;padding:14px 32px;background:#4f46e5;color:white;border-radius:12px;text-decoration:none;font-size:16px;font-weight:600;">
            返回登录
        </a>

    </div>
</div>
{% endblock %}
