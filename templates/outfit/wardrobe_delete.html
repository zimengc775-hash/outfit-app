<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>删除确认</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(180deg, #f0f2f5 0%, #e8eaf6 100%); color: #333; min-height: 100vh; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 2px 20px rgba(102,126,234,0.3);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar .brand { font-size: 17px; font-weight: 700; color: white; letter-spacing: 0.5px; }
        .navbar .nav-right { display: flex; align-items: center; gap: 5px; }
        .navbar .nav-right .user-email {
            font-size: 11px; color: rgba(255,255,255,0.65);
            padding: 0 6px; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
        }
        .navbar .nav-right a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            font-size: 13px; font-weight: 500;
            padding: 7px 13px; border-radius: 18px;
            transition: all 0.2s; white-space: nowrap;
            background: rgba(255,255,255,0.12);
        }
        .navbar .nav-right a:hover { background: rgba(255,255,255,0.25); color: white; }

        .hamburger {
            display: none; background: rgba(255,255,255,0.15);
            border: none; color: white; font-size: 19px;
            width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; align-items: center; justify-content: center;
            line-height: 1;
        }

        @media (max-width: 640px) {
            .hamburger { display: flex; }
            .nav-right { display: none !important; }
            .nav-right.open {
                display: flex !important; flex-direction: column;
                position: absolute; top: 58px; right: 12px;
                background: white; border-radius: 16px;
                padding: 6px; gap: 2px; min-width: 150px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                animation: navSlide 0.2s ease;
            }
            .nav-right.open a {
                color: #374151 !important; background: transparent !important;
                padding: 12px 16px !important; font-size: 14px; border-radius: 12px;
            }
            .nav-right.open a:hover { background: #f3f4f6 !important; }
            .nav-right.open .user-email {
                display: block !important; color: #9ca3af !important;
                padding: 8px 16px 12px; font-size: 12px;
                border-bottom: 1px solid #f3f4f6; margin-bottom: 4px;
                max-width: none;
            }
            .navbar .brand { font-size: 16px; }
        }
        @keyframes navSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { max-width: 450px; margin: 0 auto; padding: 30px 20px; }

        .card {
            background: white; border-radius: 20px; padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); text-align: center;
        }
        .card .warn-icon { font-size: 56px; margin-bottom: 12px; }
        .card h1 { font-size: 22px; color: #1f2937; margin-bottom: 8px; }
        .card p { color: #9ca3af; font-size: 14px; margin-bottom: 6px; }

        .item-preview {
            background: #f9fafb; border-radius: 14px; padding: 16px; margin: 20px 0;
            display: flex; align-items: center; gap: 14px; text-align: left;
        }
        .item-preview img {
            width: 80px; height: 80px; object-fit: cover; border-radius: 10px; background: #eee;
        }
        .item-preview .info h3 { font-size: 15px; color: #1f2937; }
        .item-preview .info span { font-size: 12px; color: #9ca3af; }

        .btn-del {
            width: 100%; padding: 16px; background: #ef4444; color: white; border: none;
            border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; margin-bottom: 12px;
        }
        .btn-del:hover { background: #dc2626; }

        .btn-cancel {
            display: block; padding: 14px; background: #f3f4f6; color: #555;
            border-radius: 14px; text-decoration: none; font-size: 16px; font-weight: 500;
        }
        .btn-cancel:hover { background: #e5e7eb; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="brand">👔 穿搭助手</span>
        <button class="hamburger" onclick="var m=document.getElementById('nav-menu');m.classList.toggle('open');event.stopPropagation();" aria-label="菜单">☰</button>
        <div class="nav-right" id="nav-menu">
            {% if user.is_authenticated %}
                <span class="user-email">{{ user.email }}</span>
                <a href="{% url 'home' %}">🏠 首页</a>
                <a href="{% url 'wardrobe-list' %}">👔 衣柜</a>
                <a href="{% url 'account_logout' %}">🚪 退出</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="warn-icon">🗑️</div>
            <h1>确认删除？</h1>
            <p>删除后无法恢复哦</p>

            <div class="item-preview">
                {% if item.img %}
                    <img src="{{ item.img.url }}" alt="{{ item.clothes_name }}">
                {% else %}
                    <div style="width:80px;height:80px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:28px;">👔</div>
                {% endif %}
                <div class="info">
                    <h3>{{ item.clothes_name }}</h3>
                    <span>{{ item.get_category_display }} · {{ item.color }}</span>
                </div>
            </div>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn-del">确认删除</button>
            </form>

            <a href="{% url 'wardrobe-list' %}" class="btn-cancel">取消，返回衣柜</a>
        </div>
    </div>

    <script>
        document.addEventListener('click', function(e) {
            var menu = document.getElementById('nav-menu');
            var btn = document.querySelector('.hamburger');
            if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
                menu.classList.remove('open');
            }
        });
    </script>
</body>
</html>
