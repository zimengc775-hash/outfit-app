<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>删除确认</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(180deg, #f0f2f5 0%, #e8eaf6 100%); color: #333; min-height: 100vh; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 24px; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px); box-shadow: 0 1px 8px rgba(0,0,0,0.06);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar .brand { font-size: 18px; font-weight: 700; color: #4f46e5; }
        .navbar a { color: #555; text-decoration: none; margin-left: 16px; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .navbar a:hover { color: #4f46e5; }

        .container { max-width: 450px; margin: 0 auto; padding: 30px 20px; }

        .card {
            background: white; border-radius: 20px; padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); text-align: center;
        }
        .card .warn-icon { font-size: 56px; margin-bottom: 12px; }
        .card h1 { font-size: 22px; color: #1f2937; margin-bottom: 8px; }
        .card p { color: #9ca3af; font-size: 14px; margin-bottom: 6px; }

        .item-preview {
            background: #f9fafb; border-radius: 14px; padding: 16px; margin: 20px 0;
            display: flex; align-items: center; gap: 14px; text-align: left;
        }
        .item-preview img {
            width: 80px; height: 80px; object-fit: cover; border-radius: 10px; background: #eee;
        }
        .item-preview .info h3 { font-size: 15px; color: #1f2937; }
        .item-preview .info span { font-size: 12px; color: #9ca3af; }

        .btn-del {
            width: 100%; padding: 16px; background: #ef4444; color: white; border: none;
            border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; margin-bottom: 12px;
        }
        .btn-del:hover { background: #dc2626; }

        .btn-cancel {
            display: block; padding: 14px; background: #f3f4f6; color: #555;
            border-radius: 14px; text-decoration: none; font-size: 16px; font-weight: 500;
        }
        .btn-cancel:hover { background: #e5e7eb; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="brand">👔 穿搭助手</span>
        <div>
            {% if user.is_authenticated %}
                <span style="font-size:13px;color:#888;">{{ user.email }}</span>
                <a href="{% url 'home' %}">首页推荐</a>
                <a href="{% url 'wardrobe-list' %}">我的衣柜</a>
                <a href="{% url 'account_logout' %}">退出</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="warn-icon">🗑️</div>
            <h1>确认删除？</h1>
            <p>删除后无法恢复哦</p>

            <div class="item-preview">
                {% if item.img %}
                    <img src="{{ item.img.url }}" alt="{{ item.clothes_name }}">
                {% else %}
                    <div style="width:80px;height:80px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:28px;">👔</div>
                {% endif %}
                <div class="info">
                    <h3>{{ item.clothes_name }}</h3>
                    <span>{{ item.get_category_display }} · {{ item.color }}</span>
                </div>
            </div>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn-del">确认删除</button>
            </form>

            <a href="{% url 'wardrobe-list' %}" class="btn-cancel">取消，返回衣柜</a>
        </div>
    </div>

</body>
</html>
