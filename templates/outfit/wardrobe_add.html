<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加衣服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(180deg, #f0f2f5 0%, #e8eaf6 100%); color: #333; min-height: 100vh; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; height: 54px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 2px 20px rgba(102,126,234,0.3);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar .brand { font-size: 17px; font-weight: 700; color: white; letter-spacing: 0.5px; }
        .navbar .nav-right { display: flex; align-items: center; gap: 5px; }
        .navbar .nav-right .user-email {
            font-size: 11px; color: rgba(255,255,255,0.65);
            padding: 0 6px; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
        }
        .navbar .nav-right a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            font-size: 13px; font-weight: 500;
            padding: 7px 13px; border-radius: 18px;
            transition: all 0.2s; white-space: nowrap;
            background: rgba(255,255,255,0.12);
        }
        .navbar .nav-right a:hover { background: rgba(255,255,255,0.25); color: white; }

        .hamburger {
            display: none; background: rgba(255,255,255,0.15);
            border: none; color: white; font-size: 19px;
            width: 36px; height: 36px; border-radius: 10px;
            cursor: pointer; align-items: center; justify-content: center;
            line-height: 1;
        }

        @media (max-width: 640px) {
            .hamburger { display: flex; }
            .nav-right { display: none !important; }
            .nav-right.open {
                display: flex !important; flex-direction: column;
                position: absolute; top: 58px; right: 12px;
                background: white; border-radius: 16px;
                padding: 6px; gap: 2px; min-width: 150px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                animation: navSlide 0.2s ease;
            }
            .nav-right.open a {
                color: #374151 !important; background: transparent !important;
                padding: 12px 16px !important; font-size: 14px; border-radius: 12px;
            }
            .nav-right.open a:hover { background: #f3f4f6 !important; }
            .nav-right.open .user-email {
                display: block !important; color: #9ca3af !important;
                padding: 8px 16px 12px; font-size: 12px;
                border-bottom: 1px solid #f3f4f6; margin-bottom: 4px;
                max-width: none;
            }
            .navbar .brand { font-size: 16px; }
        }
        @keyframes navSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { max-width: 500px; margin: 0 auto; padding: 30px 20px; }

        .card {
            background: white; border-radius: 20px; padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); text-align: center;
        }
        .card .icon { font-size: 52px; margin-bottom: 8px; }
        .card h1 { font-size: 24px; color: #1f2937; margin-bottom: 6px; }
        .card p { color: #9ca3af; font-size: 14px; margin-bottom: 28px; }

        .upload-zone {
            border: 2px dashed #d1d5db; border-radius: 16px;
            padding: 44px 20px; margin-bottom: 24px;
            cursor: pointer; transition: all 0.2s; background: #fafafa;
        }
        .upload-zone:hover { border-color: #4f46e5; background: #f8f7ff; }
        .upload-zone .zone-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone .zone-text { font-size: 15px; color: #6b7280; font-weight: 500; }
        .upload-zone .zone-hint { font-size: 12px; color: #bbb; margin-top: 6px; }

        #img-input { display: none; }

        .preview {
            width: 100%; max-height: 320px; object-fit: contain;
            border-radius: 14px; margin-bottom: 20px; display: none; background: #fafafa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .btn-submit {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(79,70,229,0.2);
        }
        .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.3); }
        .btn-submit:disabled { background: #d1d5db; cursor: not-allowed; box-shadow: none; }

        .back-link { display: block; text-align: center; margin-top: 16px; color: #9ca3af; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #4f46e5; }
    </style>
</head>
<body>

    <nav class="navbar">
        <span class="brand">👔 穿搭助手</span>
        <button class="hamburger" onclick="var m=document.getElementById('nav-menu');m.classList.toggle('open');event.stopPropagation();" aria-label="菜单">☰</button>
        <div class="nav-right" id="nav-menu">
            {% if user.is_authenticated %}
                <span class="user-email">{{ user.email }}</span>
                <a href="{% url 'home' %}">🏠 首页</a>
                <a href="{% url 'wardrobe-list' %}">👔 衣柜</a>
                <a href="{% url 'account_logout' %}">🚪 退出</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="icon">📸</div>
            <h1>添加衣服</h1>
            <p>上传一张照片，AI 会自动识别衣服属性</p>

            <form method="POST" enctype="multipart/form-data" id="upload-form">
                {% csrf_token %}
                {{ form.img }}

                <div class="upload-zone" id="upload-zone">
                    <div class="zone-icon">🖼️</div>
                    <div class="zone-text" id="zone-text">点击这里选择照片</div>
                    <div class="zone-hint">支持 JPG、PNG 格式</div>
                </div>

                <img id="preview" class="preview" alt="预览">

                <button type="submit" class="btn-submit" id="submit-btn" disabled>
                    🤖 AI 智能识别
                </button>
            </form>
        </div>

        <a href="{% url 'wardrobe-list' %}" class="back-link">← 返回衣柜</a>
    </div>

    <script>
        document.getElementById('upload-zone').onclick = function() {
            document.getElementById('id_img').click();
        };
        document.getElementById('id_img').onchange = function(e) {
            var file = e.target.files[0];
            if (file) {
                document.getElementById('zone-text').textContent = '📎 ' + file.name;
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var preview = document.getElementById('preview');
                    preview.src = ev.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                document.getElementById('submit-btn').disabled = false;
            }
        };
    </script>
    <script>
        document.addEventListener('click', function(e) {
            var menu = document.getElementById('nav-menu');
            var btn = document.querySelector('.hamburger');
            if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
                menu.classList.remove('open');
            }
        });
    </script>
</body>
</html>
